project:
  type: website
  # CNAME: `quarto publish gh-pages` replaces the branch each time, and
  # without this file GitHub drops the custom domain (tests/test_site.py).
  # Only the home page and posts are pages; the notebooks are downloads
  # the pandas posts link (tests/test_site.py).
  render:
    - index.qmd
    - posts/*.md
    - posts/*.qmd
    - archive/index.qmd
    - archive/*.md
  resources:
    - CNAME
    - assets/notebooks/
  # _drafts/ is its own local repo; Quarto skips _-prefixed dirs, so
  # _drafts/ and the old unpublished _archive/ never reach the site.
  # Preview one draft with: quarto preview _drafts/<file>.qmd

# Run ```{python} cells once and commit _freeze/: the publishing
# machine has no Jupyter (tests/test_site.py).
execute:
  freeze: auto

website:
  title: "nealcnotes"
  site-url: https://nealcnotes.com
  favicon: favicon-32x32.png
  navbar:
    left:
      - href: index.qmd
        text: Courses
    right:
      - icon: rss
        href: index.xml
  # Course notes, not a blog (Neal, 2026-11-20): each course is one
  # section, its parts in course order. Previous / Next follow this
  # order, and the home page links each course's first part
  # (tests/test_site.py). A new course is one more section.
  page-navigation: true
  sidebar:
    style: docked
    # Courses start folded; Quarto opens the one holding the current
    # page, so a reader sees only their course (Neal, 2026-11-20).
    collapse-level: 1
    contents:
      - section: "Programming"
        contents:
          - posts/lesson1-setup-gauss.qmd
          - posts/moneymath-how-long.qmd
          - posts/lesson2-shell-and-hello.qmd
          - posts/lesson3-functions.qmd
      - section: "Linear algebra"
        contents:
          - posts/linalg1-same-arrow.qmd
          - posts/linalg2-only-stretches.qmd
          - posts/linalg3-coordinates-that-measure.qmd
          - posts/linalg4-svd.qmd
      - section: "Algebra"
        contents:
          - posts/trig1-point-on-circle.qmd
          - posts/trig2-wave.qmd
          - posts/trig3-pythagoras.qmd
  # The 2023-24 comics: off the home page, one link away (tests/test_site.py).
  page-footer:
    center: "[Archive](/archive/)"

format:
  html:
    theme: cosmo
    code-copy: true
    toc: true
