project:
  type: website
  # CNAME: `quarto publish gh-pages` replaces the branch each time, and
  # without this file GitHub drops the custom domain (tests/test_site.py).
  # Only the home page and posts are pages; the notebooks are downloads
  # the pandas posts link (tests/test_site.py).
  render:
    - index.qmd
    - posts/*.md
    - posts/*.qmd
    - archive/index.qmd
    - archive/*.md
  resources:
    - CNAME
    - assets/notebooks/
  # _drafts/ is its own local repo; Quarto skips _-prefixed dirs, so
  # _drafts/ and the old unpublished _archive/ never reach the site.
  # Preview one draft with: quarto preview _drafts/<file>.qmd

website:
  title: "nealcnotes"
  site-url: https://nealcnotes.com
  favicon: favicon-32x32.png
  navbar:
    left:
      - href: index.qmd
        text: Posts
    right:
      - icon: rss
        href: index.xml
  # The 2023-24 comics: off the home page, one link away (tests/test_site.py).
  page-footer:
    center: "[Archive](/archive/)"

format:
  html:
    theme: cosmo
    code-copy: true
    toc: true
